repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key   # local secret check; full gitleaks scan runs in CI

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [pyyaml, types-pyyaml, pandas-stubs]
        files: ^libs/
        args: [--config-file=pyproject.toml]
  # NOTE: gitleaks runs in CI (.github/workflows/reconciliation.yml) — the
  # pre-commit build panics on Windows (go-re2 wasm).
