[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "results*", "data/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap must precede package imports (Robot loads the library by path)
"libs/robot/ReconciliationLibrary.py" = ["E402"]
"libs/robot/MigrationLibrary.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
exclude = ["\\.venv", "results", "data/samples", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Optional adapter drivers (requirements-adapters.txt) — not installed in CI
# and ship no type stubs, so lazy imports would trip import-untyped.
[[tool.mypy.overrides]]
module = ["pymysql", "pymysql.*", "oracledb", "oracledb.*", "pyodbc", "pyodbc.*"]
ignore_missing_imports = true
