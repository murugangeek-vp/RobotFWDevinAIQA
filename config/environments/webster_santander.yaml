# Webster Bank (local Postgres) -> Santander Bank (Snowflake) migration env.
#
# SOURCE — any database the framework has a source adapter for. Connection
# fields live here; credentials come only from env vars (${...} expanded at
# Load Environment).
environment: webster_santander_demo
run:
  batch_size: 2000
  sample_limit: 20
  allow_empty: false
  snapshot_id: synthetic-demo
source:
  type: postgres
  host: localhost
  port: 5432
  database: recon
  schema: webster            # default schema; the workbook overrides per mapping
  user: ${RECON_RO_USER}
  password: ${RECON_RO_PASSWORD}
  snapshot: exported         # pin every source session to one pg_export_snapshot()
  # snapshot_column: updated_at  # alternative for DBs without snapshot export:
                                 # adds "updated_at" <= run.snapshot_id (bound param)
  mapping_workbook: data/mapping/bank_mapping.xlsx

# TARGET — snowflake. To run a real account: set fake: false and replace the
# literals with ${SNOWFLAKE_ACCOUNT}/${SNOWFLAKE_USER}/${SNOWFLAKE_PASSWORD}/
# ${SNOWFLAKE_WAREHOUSE} env refs. fake_db_path pins the emulated warehouse so
# loader and verifier connections share state across runs.
target:
  type: snowflake
  account: local.fake
  role: RECON_RO
  warehouse: FAKE_WH
  database: SANTANDER
  schema: PUBLIC
  fake: true
  fake_db_path: results/fakesnow   # directory — one .db file per emulated database
