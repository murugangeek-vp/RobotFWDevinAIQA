# Bank-1 (enterprise ent_* schema, local Postgres) -> MSS Banking
# (mss_* schema, emulated Snowflake) migration env.
#
# Real-target variant: set target.fake: false, swap the literals for
# ${SNOWFLAKE_*} / per-DB env refs and keep source.snapshot exported (pg) or
# snapshot_column watermarking — real targets refuse unenforced snapshots.
environment: bank1_to_mss_demo
run:
  batch_size: 2000
  sample_limit: 20
  allow_empty: false
  fail_on_unmapped: false   # unmapped bank1 tables surface as insights;
                           # set true when every source table must be
                           # covered or explicitly excluded
  snapshot_id: bank1-demo-cut
source:
  type: postgres
  host: localhost
  port: 5432
  database: recon
  schema: bank1
  user: ${RECON_RO_USER}
  password: ${RECON_RO_PASSWORD}
  snapshot: exported
  control_file: data/trailer/bank1_trailer.csv
  mapping_workbook: data/mapping/bank1_to_mss.xlsx

target:
  type: snowflake
  account: local.fake
  role: RECON_RO
  warehouse: FAKE_WH
  database: MSS_CORE
  schema: PUBLIC
  fake: true
  fake_db_path: results/fakesnow_mss
