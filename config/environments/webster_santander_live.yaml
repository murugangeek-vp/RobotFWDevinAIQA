environment: webster_santander_live
run:
  batch_size: 5000
  sample_limit: 20
  allow_empty: false
  snapshot_id: ${MIGRATION_SNAPSHOT_ID}
  allow_post_snapshot: false  # rows past the watermark FAIL recon unless a delta migration is approved
source:
  type: postgres
  host: ${SOURCE_PG_HOST}
  port: 5432
  database: ${SOURCE_PG_DATABASE}
  user: ${RECON_RO_USER}
  password: ${RECON_RO_PASSWORD}
  snapshot: exported         # one pg_export_snapshot() shared by all source sessions
  # snapshot_column: migrated_at  # alternative: watermark predicate <= snapshot_id
  sslmode: verify-full
  sslrootcert: ${SOURCE_PG_CA_FILE}
target:
  type: snowflake
  fake: false
  account: ${SNOWFLAKE_ACCOUNT}
  user: ${SNOWFLAKE_USER}
  password: ${SNOWFLAKE_PASSWORD}
  warehouse: ${SNOWFLAKE_WAREHOUSE}
  database: ${SNOWFLAKE_DATABASE}
  schema: ${SNOWFLAKE_SCHEMA}
  role: ${SNOWFLAKE_ROLE}
  # asof_column: migrated_at  # optional: evidence records MAX(asof_column) per target table
