# Bank environment template: Webster extract in S3 -> Santander Snowflake.
# Every coordinate comes from environment variables set by the bank-approved runner;
# a missing variable fails the run. No secrets in this file.
environment: ${MIGRATION_ENVIRONMENT}           # e.g. sit / uat / mock-migration-1
allowed_data_classifications: [synthetic, internal, confidential, restricted]
require_object_versioning: true
source_connection:
  bucket: ${WEBSTER_S3_BUCKET}
  region_name: ${WEBSTER_S3_REGION}
  expected_bucket_owner: ${WEBSTER_S3_BUCKET_OWNER}   # 12-digit AWS account id
  # AWS credentials: standard chain (SSO / instance or task role preferred).
  # Required IAM: s3:GetObject, s3:GetObjectVersion, s3:ListBucket on the extract prefix.
target:
  type: snowflake
  account: ${SNOWFLAKE_ACCOUNT}
  warehouse: ${SNOWFLAKE_WAREHOUSE}
  database: ${SNOWFLAKE_DATABASE}
  schema: ${SNOWFLAKE_SCHEMA}
  role: ${SNOWFLAKE_ROLE}                      # SELECT-only verification role
  authenticator: SNOWFLAKE_JWT
  private_key_file_env: SNOWFLAKE_PRIVATE_KEY_FILE
  private_key_password_env: SNOWFLAKE_PRIVATE_KEY_PASSWORD
  login_timeout: 30
  network_timeout: 60
  statement_timeout: 300
  max_rows: 100000
  # RECON_RO_USER: Snowflake service user (key-pair); RECON_MASK_KEY: masking secret.
