environment: dev-mysql
target:
  type: mysql
  host: localhost
  port: 3307               # host MySQL already listens on 3306
  database: recon
  schema: recon          # in MySQL, "schema" == database
  # Credentials come from environment variables only — never stored here:
  #   read-only verification : RECON_RO_USER / RECON_RO_PASSWORD
  #   loader (read-write)    : RECON_RW_USER / RECON_RW_PASSWORD
source:
  contract: config/contracts/customer_mysql.yaml
