environment: prod-snowflake
target:
  type: snowflake
  account: ${SNOWFLAKE_ACCOUNT}        # e.g. xy12345.us-east-1 — set via env var
  warehouse: ${SNOWFLAKE_WAREHOUSE}    # e.g. RECON_WH
  database: ${SNOWFLAKE_DATABASE}
  schema: PUBLIC
  role: ${SNOWFLAKE_ROLE}                  # SELECT-only role for verification
  # Credentials come from environment variables only — never stored here:
  #   read-only verification : RECON_RO_USER / RECON_RO_PASSWORD
  #   loader (read-write)    : RECON_RW_USER / RECON_RW_PASSWORD
  authenticator: SNOWFLAKE_JWT
  private_key_file_env: SNOWFLAKE_PRIVATE_KEY_FILE
  private_key_password_env: SNOWFLAKE_PRIVATE_KEY_PASSWORD
  login_timeout: 30
  network_timeout: 60
  statement_timeout: 120
  max_rows: 100000
source:
  contract: config/contracts/customer_snowflake.yaml
