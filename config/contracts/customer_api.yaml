contract_name: customer
version: "1.0"
description: Customer feed reconciliation contract (REST API source -> PostgreSQL target)

source:
  type: api
  url: http://127.0.0.1:8080/customers
  page_param: page
  size_param: page_size
  page_size: 25
  data_path: rows
  # token_env: RECON_API_TOKEN   # set for authenticated endpoints
  timeout: 10
  max_retries: 3
  backoff: 0.5
  # Columns expected from the feed, in order.
  columns:
    - customer_id
    - first_name
    - last_name
    - email
    - dob
    - country
    - balance
    - status
    - created_at

metadata:
  expected_row_count: 100
  encoding: utf-8
  delimiter: ","

target:
  type: postgres
  schema: public
  table: customer

keys:
  - customer_id

# Target columns. `source_name` maps a source column; `transform` derives the
# value instead. Transforms support "{col}" templates and lower()/upper()/round().
columns:
  - name: customer_id
    source_name: customer_id
    type: integer
    nullable: false
    unique: true

  - name: full_name
    type: string
    nullable: false
    max_length: 201
    transform: "{first_name} {last_name}"

  - name: email
    type: string
    nullable: false
    max_length: 320
    regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    transform: "lower({email})"

  - name: dob
    source_name: dob
    type: date
    nullable: false
    date_format: "%Y-%m-%d"

  - name: country
    type: string
    nullable: false
    max_length: 2
    transform: "upper({country})"

  - name: balance
    source_name: balance
    type: decimal
    nullable: false
    scale: 2
    range: [0, 1000000]
    transform: "round({balance}, 2)"

  - name: status
    source_name: status
    type: string
    nullable: false
    allowed_values: [active, inactive, suspended]

  - name: created_at
    source_name: created_at
    type: timestamp
    nullable: false
    ts_format: "%Y-%m-%d %H:%M:%S"
