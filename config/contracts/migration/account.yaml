contract_name: account
version: "0.1.0"
description: >
  SYNTHETIC example — Webster account extract -> Santander account table.
  Account numbers are strings (leading zeros must survive). Placeholders until the
  approved mapping spec is available (ARCHITECTURE.md Q1, Q4).

source:
  type: s3
  prefix: webster/account/
  suffix: .csv
  control_file: webster/account/_control.ctl
  format: csv
  encoding: utf-8
  delimiter: ","
  columns: [acct_no, cust_id, prod_cd, ccy, open_dt, status_cd, cur_bal]

target:
  type: snowflake
  table: bank_account

keys: [account_number]

mappings:
  product:
    "CHK01": CHECKING
    "SAV01": SAVINGS
    "CD12": TERM_DEPOSIT
  account_status:
    "A": ACTIVE
    "C": CLOSED
    "D": DORMANT

controls:
  - id: row_count
    type: count
    file_name: row_count
  - id: accounts_by_status
    type: count
    group_by: [status]
  - id: balance_by_currency
    type: sum
    column: current_balance
    group_by: [currency]
  - id: balance_by_product_currency
    type: sum
    column: current_balance
    group_by: [product, currency]
  - id: max_balance
    type: max
    column: current_balance
  - id: distinct_customers
    type: count_distinct
    column: customer_id

columns:
  - name: account_number
    source_name: acct_no
    type: string
    nullable: false
    unique: true
    max_length: 10
    regex: '^\d{10}$'
    pii: true
  - name: customer_id
    source_name: cust_id
    type: integer
    nullable: false
  - name: product
    type: string
    nullable: false
    max_length: 20
    transform: "map(prod_cd, product)"
  - name: currency
    source_name: ccy
    type: string
    nullable: false
    max_length: 3
    regex: '^[A-Z]{3}$'
  - name: opened_on
    source_name: open_dt
    type: date
    nullable: false
    date_format: "%Y-%m-%d"
  - name: status
    type: string
    nullable: false
    max_length: 10
    allowed_values: [ACTIVE, CLOSED, DORMANT]
    transform: "map(status_cd, account_status)"
  - name: current_balance
    source_name: cur_bal
    type: decimal
    nullable: false
    scale: 2
    range: [-1000000000, 1000000000]
