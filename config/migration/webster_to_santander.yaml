# Webster -> Santander migration scope. One entry per table; contracts own the rules.
# Adding a table = add its contract + one entry here (no suite changes).
# data_classification gates which environments may run this manifest.
migration: webster_to_santander
version: "0.1.0"
description: SYNTHETIC pilot scope (customer, account, transaction)
source_system: webster_s3_extract
target_system: santander_snowflake
data_classification: synthetic

# Shared per-table config — declare once, override per entry where different.
# At bank scale (1000s of tables) most entries inherit; exceptions say so.
defaults:
  tier: critical

tables:
  - name: customer
    contract: config/contracts/migration/customer.yaml
  - name: account
    contract: config/contracts/migration/account.yaml
    depends_on: [customer]
  - name: transaction
    contract: config/contracts/migration/transaction.yaml
    depends_on: [account]

relationships:
  - id: account_customer
    child: account
    column: customer_id
    parent: customer
    parent_column: customer_id
  - id: transaction_account
    child: transaction
    column: account_number
    parent: account
    parent_column: account_number
