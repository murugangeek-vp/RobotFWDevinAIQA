name: reconciliation

on:
  push:
  pull_request:
  workflow_dispatch:      # on-demand runs (e.g. pre-demo verification, single test)
    inputs:
      suite:
        description: "Robot path (e.g. tests/pilot or one .robot file); empty = all suites"
        default: ""
      test_name:
        description: "robot --test NAME (exact name or glob, e.g. '*Header*')"
        default: ""
      include_tag:
        description: "robot --include TAG (e.g. exclude nothing / include smoke)"
        default: ""
      exclude_tag:
        description: "robot --exclude TAG (e.g. requires_write for verify-only runs)"
        default: ""
  schedule:
    - cron: "0 2 * * *"   # nightly run against the test database

jobs:
  pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: recon_src
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: sys_ci_pwd
        ports: ["1521:1521"]
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s --health-timeout 10s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -l 2 -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 10s --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quality gates (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Provision recon database and roles
        run: |
          export PGPASSWORD=postgres_ci
          psql -h localhost -U postgres -c "CREATE DATABASE recon;"
          psql -h localhost -U postgres -d recon <<'SQL'
            CREATE ROLE recon_rw LOGIN PASSWORD '${{ secrets.RECON_RW_PASSWORD }}';
            CREATE ROLE recon_ro LOGIN PASSWORD '${{ secrets.RECON_RO_PASSWORD }}';
            GRANT CONNECT ON DATABASE recon TO recon_rw, recon_ro;
            GRANT USAGE, CREATE ON SCHEMA public TO recon_rw;
            GRANT USAGE ON SCHEMA public TO recon_ro;
            GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO recon_rw;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO recon_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE recon_rw IN SCHEMA public GRANT SELECT ON TABLES TO recon_ro;
          SQL

      - name: Seed migration demo (webster source + emulated Santander target)
        # Migration suites are verify-only — the emulated target is loaded
        # out-of-band here, same as a real bank ETL would load it.
        if: inputs.suite == '' || contains(inputs.suite, 'migration')
        env:
          RECON_ADMIN_USER: postgres
          RECON_ADMIN_PASSWORD: postgres_ci
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
        run: |
          python scripts/generate_bank_source.py --rows 500 --confirm-synthetic
          python scripts/load_migration_target.py

      - name: Run reconciliation suites
        env:
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
          RECON_RW_USER: recon_rw
          RECON_RW_PASSWORD: ${{ secrets.RECON_RW_PASSWORD }}
          SUITE: ${{ inputs.suite }}
          TEST_NAME: ${{ inputs.test_name }}
          INCLUDE_TAG: ${{ inputs.include_tag }}
          EXCLUDE_TAG: ${{ inputs.exclude_tag }}
        run: |
          cmd=(robot -d results)
          [ -n "$TEST_NAME" ] && cmd+=(--test "$TEST_NAME")
          [ -n "$INCLUDE_TAG" ] && cmd+=(--include "$INCLUDE_TAG")
          [ -n "$EXCLUDE_TAG" ] && cmd+=(--exclude "$EXCLUDE_TAG")
          cmd+=("${SUITE:-tests/pilot}")
          "${cmd[@]}"
          # Full runs cover both suites; a dispatch picking one path skips the other.
          if [ -z "$SUITE" ]; then
            robot -d results/migration tests/migration
          fi

      - name: Engine unit tests
        run: |
          python -m unittest discover -s tests/pilot -p "test_*.py" -v
          python -m unittest discover -s tests/migration -p "test_*.py" -v

      - name: MySQL adapter smoke (real mysqld)
        # Proves the dbapi adapters end-to-end on a real engine: RO grants,
        # streaming chunks, watermark predicates, SELECT-only query guard.
        env:
          MYSQL_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
        run: |
          pip install pymysql==1.1.1
          python scripts/mysql_adapter_smoke.py

      - name: Oracle adapter smoke (real Oracle XE)
        env:
          ORACLE_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
        run: |
          pip install oracledb==2.5.1
          python scripts/oracle_adapter_smoke.py

      - name: Install msodbcsql18 (host ODBC driver)
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev

      - name: MSSQL adapter smoke (real SQL Server)
        env:
          MSSQL_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
        run: |
          pip install pyodbc==5.1.0
          python scripts/mssql_adapter_smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: |
            results/report.html
            results/log.html
            results/output.xml
            results/run_summary.json
            results/business_rules_summary.xlsx
            results/migration/
