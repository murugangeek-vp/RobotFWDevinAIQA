name: reconciliation

on:
  push:
  pull_request:
  workflow_dispatch:      # on-demand runs (e.g. pre-demo verification, single test)
    inputs:
      suite:
        description: "Robot path (e.g. tests/migration or one .robot file); empty = all suites"
        default: ""
      test_name:
        description: "robot --test NAME (exact name or glob, e.g. '*Header*')"
        default: ""
      include_tag:
        description: "robot --include TAG (e.g. smoke)"
        default: ""
      exclude_tag:
        description: "robot --exclude TAG (e.g. requires_write for verify-only runs)"
        default: ""
  schedule:
    - cron: "0 2 * * *"   # nightly run against the test database

jobs:
  phase1-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quality gates (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dry-run suite parse check
        # Cheap pre-flight: catches .robot syntax/config breakage in seconds
        # before databases are provisioned. Keywords are no-ops in dryrun.
        run: robot --dryrun -d results/dryrun tests/migration

      - name: Provision phase-1 databases, schemas and roles
        # Three PostgreSQL databases mirror the UAT layering:
        #   wdr_uat_active_stage.signature    (CSV landing)
        #   wdr_uat_integration.wdr_int_core   (integration core)
        #   wdr_uat_consumption.wdr_cl_fds_core (consumption/target)
        # recon_rw loads fixtures; recon_ro is SELECT-only for verification.
        run: |
          export PGPASSWORD=postgres_ci
          psql -h localhost -U postgres <<'SQL'
            CREATE ROLE recon_rw LOGIN PASSWORD '${{ secrets.RECON_RW_PASSWORD }}';
            CREATE ROLE recon_ro LOGIN PASSWORD '${{ secrets.RECON_RO_PASSWORD }}';
            CREATE DATABASE wdr_uat_active_stage;
            CREATE DATABASE wdr_uat_integration;
            CREATE DATABASE wdr_uat_consumption;
          SQL
          psql -h localhost -U postgres -d wdr_uat_active_stage <<'SQL'
            CREATE SCHEMA signature;
            GRANT CONNECT ON DATABASE wdr_uat_active_stage TO recon_rw, recon_ro;
            GRANT USAGE, CREATE ON SCHEMA signature TO recon_rw;
            GRANT USAGE ON SCHEMA signature TO recon_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE recon_rw IN SCHEMA signature GRANT SELECT ON TABLES TO recon_ro;
          SQL
          psql -h localhost -U postgres -d wdr_uat_integration <<'SQL'
            CREATE SCHEMA wdr_int_core;
            GRANT CONNECT ON DATABASE wdr_uat_integration TO recon_rw, recon_ro;
            GRANT USAGE, CREATE ON SCHEMA wdr_int_core TO recon_rw;
            GRANT USAGE ON SCHEMA wdr_int_core TO recon_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE recon_rw IN SCHEMA wdr_int_core GRANT SELECT ON TABLES TO recon_ro;
          SQL
          psql -h localhost -U postgres -d wdr_uat_consumption <<'SQL'
            CREATE SCHEMA wdr_cl_fds_core;
            GRANT CONNECT ON DATABASE wdr_uat_consumption TO recon_rw, recon_ro;
            GRANT USAGE, CREATE ON SCHEMA wdr_cl_fds_core TO recon_rw;
            GRANT USAGE ON SCHEMA wdr_cl_fds_core TO recon_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE recon_rw IN SCHEMA wdr_cl_fds_core GRANT SELECT ON TABLES TO recon_ro;
          SQL

      - name: Generate phase-1 workbooks and CSV fixtures
        # Deterministic synthetic data: workbooks compiled from
        # data/trailer/Phase1.xlsx; CSVs seeded positive/negative fixtures
        # plus per-hop bank trailer files.
        run: |
          python scripts/generate_phase1_workbooks.py
          python scripts/generate_phase1_csv.py

      - name: Load emulated targets (all three hops)
        # Verification suites are read-only — loaders act as the bank's ETL.
        # Stage view needs hop-1 tables; INT view needs hop-2 tables.
        # Source reads authenticate as recon_ro; target writes as recon_rw.
        env:
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
          RECON_RW_USER: recon_rw
          RECON_RW_PASSWORD: ${{ secrets.RECON_RW_PASSWORD }}
        run: |
          python scripts/load_phase2_hop.py --hop 1
          python scripts/provision_phase2.py --views stage
          python scripts/load_phase2_hop.py --hop 2
          python scripts/provision_phase2.py --views int
          python scripts/load_phase2_hop.py --hop 3

      - name: Run phase-1 migration suites (read-only verification)
        env:
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
          SUITE: ${{ inputs.suite }}
          TEST_NAME: ${{ inputs.test_name }}
          INCLUDE_TAG: ${{ inputs.include_tag }}
          EXCLUDE_TAG: ${{ inputs.exclude_tag }}
        run: |
          cmd=(robot -d results)
          [ -n "$TEST_NAME" ] && cmd+=(--test "$TEST_NAME")
          [ -n "$INCLUDE_TAG" ] && cmd+=(--include "$INCLUDE_TAG")
          [ -n "$EXCLUDE_TAG" ] && cmd+=(--exclude "$EXCLUDE_TAG")
          if [ -z "$SUITE" ]; then
            robot -d results/phase1/hop1 --xunit xunit.xml \
              -v MIGRATION_ENV:config/environments/phase1_hop1_csv_stage.yaml \
              -v MAPPING_WORKBOOK:data/mapping/phase1_hop1_csv_to_stage.xlsx \
              tests/migration
            robot -d results/phase1/hop2 --xunit xunit.xml \
              -v MIGRATION_ENV:config/environments/phase1_hop2_stage_int.yaml \
              -v MAPPING_WORKBOOK:data/mapping/phase1_hop2_stage_to_int.xlsx \
              tests/migration
            robot -d results/phase1/hop3 --xunit xunit.xml \
              -v MIGRATION_ENV:config/environments/phase1_hop3_int_consumption.yaml \
              -v MAPPING_WORKBOOK:data/mapping/phase1_hop3_int_to_consumption.xlsx \
              tests/migration
            # One combined pipeline report for the whole migration chain
            rebot --merge -d results/phase1/merged --name "Phase-1 Migration" \
              results/phase1/hop1/output.xml \
              results/phase1/hop2/output.xml \
              results/phase1/hop3/output.xml
          else
            "${cmd[@]}" "$SUITE"
          fi

      - name: Negative-path proof (hop-1 corrupted extract)
        # The same suite against corrupted CSVs MUST fail — detection is the
        # feature. Non-zero exit is the expected outcome.
        if: inputs.suite == '' || contains(inputs.suite, 'migration')
        env:
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
        run: |
          if robot -d results/phase1/hop1_negative \
              -v MIGRATION_ENV:config/environments/phase1_hop1_csv_stage_negative.yaml \
              -v MAPPING_WORKBOOK:data/mapping/phase1_hop1_csv_to_stage.xlsx \
              tests/migration; then
            echo "::error::negative fixture did not fail — defect detection broken"
            exit 1
          fi
          grep -q '"extra": 5' results/phase1/hop1_negative/run_summary.json
          echo "negative path verified: exact missing/extra/control/orphan counts reported"

      - name: Engine unit tests
        run: |
          python -m unittest discover -s tests/migration -p "test_*.py" -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: |
            results/report.html
            results/log.html
            results/output.xml
            results/run_summary.json
            results/phase1/
