name: reconciliation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"   # nightly run against the test database

jobs:
  mvp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql_ci
          MYSQL_DATABASE: recon
        ports: ["3307:3306"]   # 3307 matches dev_mysql.yaml (3306 may be taken)
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quality gates (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Provision recon database and roles
        run: |
          export PGPASSWORD=postgres_ci
          psql -h localhost -U postgres -c "CREATE DATABASE recon;"
          psql -h localhost -U postgres -d recon <<'SQL'
            CREATE ROLE recon_rw LOGIN PASSWORD '${{ secrets.RECON_RW_PASSWORD }}';
            CREATE ROLE recon_ro LOGIN PASSWORD '${{ secrets.RECON_RO_PASSWORD }}';
            GRANT CONNECT ON DATABASE recon TO recon_rw, recon_ro;
            GRANT USAGE, CREATE ON SCHEMA public TO recon_rw;
            GRANT USAGE ON SCHEMA public TO recon_ro;
            GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE ON ALL TABLES IN SCHEMA public TO recon_rw;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO recon_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE recon_rw IN SCHEMA public GRANT SELECT ON TABLES TO recon_ro;
          SQL

      - name: Provision MySQL database and roles
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -pmysql_ci -e "
            CREATE USER IF NOT EXISTS 'recon_rw'@'%' IDENTIFIED BY '${{ secrets.RECON_RW_PASSWORD }}';
            CREATE USER IF NOT EXISTS 'recon_ro'@'%' IDENTIFIED BY '${{ secrets.RECON_RO_PASSWORD }}';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES ON recon.* TO 'recon_rw'@'%';
            GRANT SELECT ON recon.* TO 'recon_ro'@'%';
            FLUSH PRIVILEGES;"

      - name: Run reconciliation suites (MVP + adapters + api + s3 + mysql)
        env:
          RECON_RO_USER: recon_ro
          RECON_RO_PASSWORD: ${{ secrets.RECON_RO_PASSWORD }}
          RECON_RW_USER: recon_rw
          RECON_RW_PASSWORD: ${{ secrets.RECON_RW_PASSWORD }}
        run: robot -d results tests/mvp tests/adapters tests/api tests/s3 tests/mysql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-reports
          path: |
            results/report.html
            results/log.html
            results/output.xml
            results/run_summary.json
